name: Publish 🚀

on:
  workflow_dispatch:
  push:
    branches:
    - develop

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
          
      - name: Restore
        run: dotnet restore ./TryIt.sln
        
      - name: Build
        run: dotnet build ./TryIt.sln --configuration Release --no-restore
        
      - name: Test
        run: dotnet test ./TryIt.sln --configuration Release --no-restore --verbosity normal


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
    
      - name: Build and Push DockerIdentityServerImage
        uses: docker/build-push-action@v4
        with:
          context: ./src
          file: ./src/IdentityServer.Dockerfile
          push: true
          tags: mbrostik/tryitapp:latest
